phases:
  architecture:
    status: complete
    owner_notes:
      - "Completed via codecarto_complete."
      - "Primary output: .codecarto/findings/architecture/architecture-map.md"
      - "Validation: PASS"
      - "Mapped 82 tracked files across three named product layers (Layer 1 Android app, Layer 2 proot/Alpine sandbox, Layer 3 Node wrapper) plus one non-product module (spike-host-alpine, historical spike evidence)."
      - "Dependency graph is acyclic. Lowest stable layer inside the repo is wrapper/Protocol.kt and sandbox/SandboxState.kt - pure data and constants, imported by others, importing nothing from the project."
      - "Layer 3 is shipped inside Layer 1 as an APK asset and copied into Layer 2's filesystem at provisioning time, so the layers are nested at runtime rather than merely adjacent. Confirmed by inspecting the built APK."
      - "All five declared secondary outputs were written, not deferred: public-surfaces, runtime-lifecycle, state-and-storage, build-and-deploy, config-model."
      - "Evidence basis is unusually strong for an architecture pass: the sandbox, protocol and storage paths were exercised on physical hardware during this session, so several conclusions are runtime-verified rather than inferred. See android/VERIFICATION.md."
    outputs_present:
      - findings/architecture/architecture-map.md
    open_questions:
      -
        id: q-r8-release-shape
        kind: runtime-test
        description: "No release or minified build has ever been produced, so R8/ProGuard effects on the kotlinx-serialization protocol models are unverified. proguard-rules.pro exists but has never been exercised."
        deferred_reason: "Needs an actual assembleRelease plus an on-device run; no amount of static reading settles whether the wire models survive shrinking."
      -
        id: q-provider-table-drift
        kind: maintainer-decision
        description: "AgentProvider.kt and the PROVIDERS table in wrapper.mjs encode the same contract in two languages with nothing enforcing agreement. Drift fails at run time rather than build time."
        deferred_reason: "Whether to generate one from the other, add a cross-language test, or accept the duplication is a design ruling, not a finding."
      -
        id: q-fgs-survival
        kind: runtime-test
        description: "Whether the dataSync foreground service actually keeps a long agent run alive under real memory pressure and Doze is unmeasured."
        deferred_reason: "Requires a long-running device test under induced memory pressure."
      -
        id: q-anthropic-on-device
        kind: runtime-test
        description: "The provider v1 ships against has never made a live call from the handset; every device run so far used openai-completions via Ollama Cloud."
        deferred_reason: "Needs a device session with an Anthropic key; the code path differs from the one already verified."
    carry_forward: []
  defect-scan:
    status: complete
    owner_notes:
      - "Completed via codecarto_complete."
      - "Primary output: .codecarto/findings/defect-scan/defect-report.md"
      - "Validation: PASS WITH GAPS"
      - "13 findings across all six passes: 0 critical, 2 high, 6 medium, 5 low. Coverage PARTIAL."
      - "Contradiction sweep against the architecture phase found one: ROADMAP.md's stage claims contradict verified state (reports 8/8 tests where the suite is 25/25, and says 1.2c is not built when it is built, installed and running). Recorded as finding 5.2 rather than smoothed over."
      - "The two high findings interact and describe one weak area: WrapperClient.call can orphan a request when the process exits during registration (3.1), no timeout exists to break the resulting hang (2.2), and the adjacent path crashes the app instead of failing the session (2.1). The wrapper-death path is the least robust part of the codebase."
      - "Structural asymmetry worth acting on: the Node wrapper handles serialization failure, backpressure, EPIPE, malformed requests and unknown methods, while both high findings are in Kotlin. That tracks test coverage exactly - the wrapper has 25 tests and android/ has none."
      - "Six earlier defects found by on-device verification this session are already fixed and are not re-listed here; this scan is static and covers what remains."
    outputs_present:
      - findings/defect-scan/defect-report.md
    open_questions:
      -
        kind: needs-maintainer-decision
        description: "Coverage and limits name inspected scope, skipped scope, evidence basis, and blind spots."
        deferred_reason: "All four named, but disposition is PARTIAL: Android lifecycle and release-build surfaces are unreachable without a harness that does not exist. Tracked as `q-android-test-harness`; the race's reproducibility is tracked as `q-wrapperclient-race-repro`."
        id: oq-defect-scan-1
      -
        id: q-wrapperclient-race-repro
        kind: runtime-test
        description: "Whether finding 3.1 is reachable in practice, and at what rate, is unmeasured. The window is between a null exitCode read and a ConcurrentHashMap insert."
        deferred_reason: "Needs a stress harness that kills the wrapper mid-request; static reading cannot establish the rate."
      -
        id: q-android-test-harness
        kind: maintainer-decision
        description: "android/ has no tests at all, which is why passes 1-3 found more there than in the wrapper. Whether to add JVM/Robolectric tests, instrumented tests, or both is a project decision."
        deferred_reason: "A scope and tooling ruling rather than a finding."
    carry_forward: []
next_actions:
