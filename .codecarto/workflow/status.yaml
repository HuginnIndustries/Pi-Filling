    open_questions:
      -
        id: q-r8-release-shape
        kind: runtime-test
        description: "No release or minified build has ever been produced, so R8/ProGuard effects on the kotlinx-serialization protocol models are unverified. proguard-rules.pro exists but has never been exercised."
        deferred_reason: "Needs an actual assembleRelease plus an on-device run; no amount of static reading settles whether the wire models survive shrinking."
      -
        id: q-provider-table-drift
        kind: maintainer-decision
        description: "AgentProvider.kt and the PROVIDERS table in wrapper.mjs encode the same contract in two languages with nothing enforcing agreement. Drift fails at run time rather than build time."
        deferred_reason: "Whether to generate one from the other, add a cross-language test, or accept the duplication is a design ruling, not a finding."
      -
        id: q-fgs-survival
        kind: runtime-test
        description: "Whether the dataSync foreground service actually keeps a long agent run alive under real memory pressure and Doze is unmeasured."
        deferred_reason: "Requires a long-running device test under induced memory pressure."
      -
        id: q-anthropic-on-device
        kind: runtime-test
        description: "The provider v1 ships against has never made a live call from the handset; every device run so far used openai-completions via Ollama Cloud."
        deferred_reason: "Needs a device session with an Anthropic key; the code path differs from the one already verified."
    carry_forward: []
