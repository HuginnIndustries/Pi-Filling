  - 'Verified on a Galaxy Z Fold 5 with a discriminating test rather than an absence of symptoms. The wrapper''s node process was killed, then a prompt sent into the dead wrapper. The app pid was unchanged before and after, and logcat carried ''AgentController: wrapper exited during prompt'' - which proves the guarded path was taken, not that the exception failed to occur. The UI showed ''Failed: wrapper exited (code 255)'' and offered Start session again.'
